# Every merge into development tests, then publishes the result as the `dev` tag
# on Docker Hub. `dev` is the moving edge of the integration branch and is
# overwritten on every merge - it is for the author's own machine, not a release.
name: Development image

on:
  push:
    branches:
      - development

# Two merges landing close together would otherwise race to overwrite one tag,
# and the loser could be the newer commit. Not cancelled in progress: a run that
# has already pushed is not something a later one should abandon halfway.
concurrency:
  group: dev-image
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  IMAGE_NAME: carlocgc/weighttracker

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore app
        run: dotnet restore ./src/WeightTracker.Web/WeightTracker.Web.csproj

      - name: Restore tests
        run: dotnet restore ./tests/WeightTracker.Tests/WeightTracker.Tests.csproj

      - name: Build app
        run: dotnet build ./src/WeightTracker.Web/WeightTracker.Web.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build ./tests/WeightTracker.Tests/WeightTracker.Tests.csproj --configuration Release --no-restore

      # Before the login below, so a red suite never reaches the registry.
      - name: Run tests
        run: dotnet test ./tests/WeightTracker.Tests/WeightTracker.Tests.csproj --configuration Release --no-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          # One tag, overwritten every merge. `development` is where you look to
          # find out what is in `dev`.
          tags: docker.io/${{ env.IMAGE_NAME }}:dev
